[uwsgi]
master = true
# plugin = python3  # Pip-installed uwsgi has the python plugin built-in
socket = :3030
virtualenv = /venv
chdir = /app
module = wsgilauncher:app
processes = 10
threads = 2
# LS: We don't read stats
# stats = :9190
# Due to https://github.com/ecotaxa/ecotaxa_dev/issues/716
# and https://github.com/ecotaxa/ecotaxa_dev/issues/656
buffer-size = 16384

# Static files, which are not (anymore) visible from a system-global nginx.
# Note: The effect of below setting is not visible in a browser unless you look in dev tools for cached (or not) static
static-map = /static=/app/appli/static
# 3 months expire
static-expires = /* 7776000
offload-threads = %k

# Only log problematic requests, they are in python already but some of them may escape e.g. brutal exit
disable-logging = true
log-4xx = true
log-5xx = true
log-format = %(pid)|%(ftime)|%(method) %(uri) %(status) | %(msecs)ms
